services:
  - type: web
    name: movie-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: movie-platform-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SITE_URL
        sync: false

databases:
  - name: movie-platform-db
    databaseName: moviefinder
    user: moviefinder_user
