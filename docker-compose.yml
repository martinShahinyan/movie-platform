version: '3.8'

services:
  web:
    build: .
    container_name: movie_platform_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://postgres:postgres_secure_password@db:5432/moviefinder
      - SECRET_KEY=change-this-to-a-very-long-secret-key-in-production
      - ADMIN_PASSWORD=change-this-admin-password
      - SITE_URL=https://yourdomain.com
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: movie_platform_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: moviefinder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
