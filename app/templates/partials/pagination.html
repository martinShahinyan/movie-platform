{# params: pg (Page), page_url (callable) #}
{% if pg.pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if pg.page > 1 %}<a class="btn btn--ghost" rel="prev" href="{{ page_url(pg.page - 1) }}">Previous</a>{% else %}<span></span>{% endif %}
  <span class="pagination__status">Page {{ pg.page }} of {{ pg.pages }}</span>
  {% if pg.page < pg.pages %}<a class="btn btn--ghost" rel="next" href="{{ page_url(pg.page + 1) }}">Next</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
